# SDP pipeline for scenario "CM holidays_2".
resources:
  pipelines:
    gbs_hr_codir_cm_holi_2_11_pipeline:
      name: gbs-hr-codir-cm-holi-2
      catalog: ${var.catalog}
      schema: brz
      serverless: true
      photon: true
      channel: CURRENT
      continuous: false
      configuration:
        # Column names are preserved verbatim (spaces, punctuation, pivot modalities like
        # `Deposit Account_revenue_avg`); enable Delta column mapping on every table the pipeline creates so
        # those names are valid (else DELTA_INVALID_CHARACTERS_IN_COLUMN_NAMES on a non-mapped table).
        spark.databricks.delta.properties.defaults.columnMapping.mode: name
      root_path: ../transformations/cm_holidays_2
      libraries:
        - glob:
            include: ../transformations/cm_holidays_2/**
      tags:
        source: dataiku-migration
        programme: gbs_hr_codir
        scenario: cm_holidays_2
