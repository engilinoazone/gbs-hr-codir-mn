# SDP pipeline for scenario "TA Requisitions Dataset".
resources:
  pipelines:
    gbs_hr_codir_ta_requ_data_5_pipeline:
      name: gbs-hr-codir-ta-requ-data
      catalog: ${var.catalog}
      schema: raw_data
      serverless: true
      photon: true
      channel: CURRENT
      continuous: false
      configuration:
        # Column names are preserved verbatim (spaces, punctuation, pivot modalities like
        # `Deposit Account_revenue_avg`); enable Delta column mapping on every table the pipeline creates so
        # those names are valid (else DELTA_INVALID_CHARACTERS_IN_COLUMN_NAMES on a non-mapped table).
        spark.databricks.delta.properties.defaults.columnMapping.mode: name
      root_path: ../transformations/ta_requisitions_dataset
      libraries:
        - glob:
            include: ../transformations/ta_requisitions_dataset/**
      tags:
        source: dataiku-migration
        programme: gbs_hr_codir
        scenario: ta_requisitions_dataset
