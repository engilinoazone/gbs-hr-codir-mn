# Generated by dataiku-migration from Dataiku project "HR GBS Project".
# Catalog is the environment: `databricks bundle deploy -t dev` (override with --var="catalog=<env>").
# Resources live in resources/*.yml: one SDP pipeline per batch + an orchestration job (deploy order).
bundle:
  name: gbs-hr-codir

include:
  - resources/*.yml

variables:
  catalog:
    description: Target Unity Catalog (one per environment); schemas carry the medallion layer.
    default: gbshr_reference_dev

targets:
  # Development mode is safe now that the bundle no longer creates the target schema: it only prefixes
  # the pipeline/job *resource* names (an isolated dev sandbox) — the UC catalog/schema/tables are set by
  # `catalog`/`schema` on the pipeline, not by the target mode.
  dev:
    mode: development
    default: true
  prod:
    mode: production
